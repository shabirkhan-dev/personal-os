# CD: every push to main passes the full quality gate first; then database migrations run
# (when DATABASE_URL is set) and the live API is checked once Workers Builds has deployed it.
# The Workers themselves deploy through Cloudflare Workers Builds (see /docs/deploy).
#
# Repository settings this uses (Settings → Secrets and variables → Actions):
#   secret   DATABASE_URL  Neon connection string for production migrations (optional)
#   variable API_URL       e.g. https://api.example.com (optional; enables the smoke check)
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # apps/api tests run against a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release gate
        run: bun run preflight
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  migrate:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without a database
        if: env.DATABASE_URL == ''
        run: echo "::notice::DATABASE_URL is not set; migrations skipped (run them by hand, see /docs/deploy)."

      - name: Setup Bun
        if: env.DATABASE_URL != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: bun install --frozen-lockfile

      - name: Apply migrations
        if: env.DATABASE_URL != ''
        run: bun --cwd=apps/api run db:migrate

  smoke:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Skip without an API URL
        if: env.API_URL == ''
        run: echo "::notice::API_URL is not set; smoke check skipped."

      - name: Wait for the deploy and check the API
        if: env.API_URL != ''
        run: |
          # Workers Builds deploys in parallel; give it up to ten minutes to answer healthy.
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 "$API_URL/api/v1/ready" > /dev/null &&
               curl --fail --silent --show-error --max-time 10 "$API_URL/api/v1/health" | grep -q '"status":"ok"'; then
              echo "API is healthy (attempt $attempt)."
              exit 0
            fi
            sleep 30
          done
          echo "::error::The API did not answer healthy at $API_URL"
          exit 1
