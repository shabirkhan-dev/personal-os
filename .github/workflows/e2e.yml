# End-to-end checks on a real Android emulator: builds the release APK, installs it and runs the
# Maestro flows in apps/mobile/e2e (first launch, templates, reminders, backup, security).
# Slow (~25 min): runs on main, nightly, by hand, and on pull requests that change the checks.
name: E2E

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/**", ".github/workflows/e2e.yml"]
  # Pull requests only when the checks themselves change; app changes are covered on main.
  pull_request:
    paths: ["apps/mobile/e2e/**", ".github/workflows/e2e.yml"]
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The flows don't need the server; a set URL lets signed-out screens behave as in release.
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://example.invalid' }}
      NODE_ENV: production
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Ubuntu runner already has the Android SDK (ANDROID_HOME); Gradle fetches what it needs.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install --clean

      - name: Build the release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=x86_64

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell settings put global window_animation_scale 0 && sleep 30
            maestro test apps/mobile/e2e --format junit --output e2e-report.xml --test-output-dir e2e-output || (echo "::group::What was on screen"; maestro hierarchy | grep -oE '"(text|accessibilityText|resource-id)" *: *"[^"]+"' | head -80; echo "::endgroup::"; echo "::group::App log"; adb logcat -d | grep -iE "ReactNativeJS|AndroidRuntime|FATAL|personalos|SQLite|expo" | tail -200; echo "::endgroup::"; exit 1)

      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-report.xml
            e2e-output
          if-no-files-found: ignore
