# The reminders screen checks the phone and sets water reminders.
appId: com.shabirkhandev.personalos
name: 03-reminders
---
- openLink: personalos://reminders
- extendedWaitUntil:
    visible: "Send a test reminder"
    timeout: 15000
- assertVisible: "Alarms and reminders"
- scrollUntilVisible:
    element: "Remind me to drink"
- tapOn: "Remind me to drink"
# Turning it on shows how often, right under the switch.
- scrollUntilVisible:
    element: "Every 2 h"
    timeout: 15000
- takeScreenshot: 03-reminders
