services:
  rust-api:
    profiles: ["rust"]
    build:
      context: ../..
      dockerfile: apps/rust/Dockerfile
    image: personal-os-rust-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-personal-os}:${POSTGRES_PASSWORD:-personal-os}@postgres:5432/${POSTGRES_DB:-personal-os}
      PORT: 3002
      APP_NAME: personal-os-rust
      APP_VERSION: 0.1.0
      NODE_ENV: production
    ports:
      - "${RUST_API_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
