# Render Blueprint: the Nest API and the AI service. Postgres lives on Neon.
# https://render.com/docs/blueprint-spec
#
# The phone talks only to personal-os-api. That service calls personal-os-ai over HTTPS with a
# shared token, which Render generates once on the AI service and copies to the API.
#
# After the first deploy:
#   1. Copy the AI service's URL (https://<name>.onrender.com) into AI_API_URL on the API.
#   2. Set EXPO_PUBLIC_NEST_API_URL in EAS to the API's URL and build the app.
# Full steps: /docs/deploy.

services:
  - type: web
    name: personal-os-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/nest-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: AUTH_DEV_EXPOSE_CODES
        value: "false"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: APP_NAME
        value: Personal OS
      # Paste from the Neon console (pooled URL).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      # Sign-in codes go out by email (https://resend.com).
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      # The AI service's public URL, e.g. https://personal-os-ai.onrender.com (no path).
      - key: AI_API_URL
        sync: false
      # Same value as the AI service, so only the API can call it.
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: personal-os-ai
          envVarKey: AI_SERVICE_TOKEN
      # Only needed for browser clients; the mobile app uses neither cookies nor CORS.
      - key: WEB_APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false

  - type: web
    name: personal-os-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/ai-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # The image listens on 8000; this tells Render where to route.
      - key: PORT
        value: "8000"
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: AI_PROVIDER
        value: openai_compatible
      # Your provider key. Any OpenAI-compatible provider works: change the base URL and model.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
